<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1540" viewBox="0 0 1600 1540" role="img" aria-labelledby="title desc">
  <title id="title">Free-Stuff-Near-You — F$NY Color Variants, v8</title>
  <desc id="desc">Six soft-green palettes for the selected soft-rounded local tag in a three-column by two-row flat comparison sheet. Each mark contains F$NY, with S replaced by a literal dollar sign, plus a small zero inside the tag above the F$NY initials. The entire mark and internal type share a minus-eight-degree rotation; matching right and bottom points retain their exact geometry. All variants are unadopted.</desc>
