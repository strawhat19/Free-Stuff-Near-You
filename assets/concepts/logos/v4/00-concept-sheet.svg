<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1540" viewBox="0 0 1600 1540" role="img" aria-labelledby="title desc">
  <title id="title">Free-Stuff-Near-You — Seamless Local Tag Refinements, v4</title>
  <desc id="desc">Six unadopted refinements on the same three-column by two-row flat comparison layout. Every mark uses one continuous filled price-tag and lower local-point contour with broad transitions and no separate pointer. Three standard $0 options, two FSNY variants, and a plain tag retain the soft-green family. Each card includes its exact wordmark, palette, and compact monochrome design samples.</desc>
