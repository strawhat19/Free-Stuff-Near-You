  <title id="title">Free-Stuff-Near-You — Local Tag Refinements, v3</title>
  <desc id="desc">Six unadopted refinements across three selected tag shapes, shown on a flat three-column by two-row comparison sheet. Proper standard dollar signs replace the earlier custom strokes in the sage, mint-tilt, and rounded-ticket variants. Two FSNY variants and one plain tag complete the round. Every option includes an attached lower local-pin base, exact wordmark, soft-green palette, and monochrome samples.</desc>
