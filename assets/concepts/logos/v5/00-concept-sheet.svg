  <title id="title">Free-Stuff-Near-You — Matched Local Tag Refinements, v5</title>
  <desc id="desc">Six unadopted options in the same three-column by two-row flat comparison layout. The right tag point and bottom local point are identical reflected motifs, including contour rounding, projection, and hole dimensions and offsets. All use one continuous exterior and soft greens. Dollar signs are smaller than their zeros and have complementary green accents. FSNY and plain variants retain the same compact geometry.</desc>
